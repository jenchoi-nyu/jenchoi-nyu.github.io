<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experience Echo + Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <!-- Load p5.js first, then p5.sound.js, then script.js -->
  <script src="libs/p5.js"></script>
  <script src="libs/p5.sound.js"></script> <!-- Load from local file -->
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Top Navigation Bar -->
<nav class="navbar">
  <a href="index.html" class="logo-link">
    <img src="Logo_white.png" alt="Echo + Form Logo" class="logo-img">
  </a>

  <div id="keyboardInstructions" class="keyboard-instructions" style="display: none;">
    <div class="instruction-text">SPACE Key = Pause/Resume | ESC Key = Reset | RETURN Key = Screenshot</div>
    <div class="instruction-button">
      <a href="#" id="viewModelsLink" class="experience-button">Complete Your Info</a>
    </div>
  </div>
</nav>

  <!-- Experience Page Content -->
  <div class="experience-container">
    <div class="content">
      <!-- Main Title -->
      <h1 class="main-title">Speak Your Name<br>to Shape the Form</h1>

      <!-- Start Button -->
      <button id="startButton" class="start-button">Start Recording</button>

      <!-- Countdown with message -->
      <div id="countdown" class="countdown" style="display: none;">
        <h5>Speak Your Name in</h5><h1><span id="countdown-number">3</span></h1>
      </div>
    </div>
  </div>

  <!-- Add p5.js canvas element -->
  <div id="p5-canvas-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none;"></div>
  <!-- Popup Modal -->
  <div id="modelModal">
    <div id="modalContent">
      <img src="stories/Survey_QR.png" alt="Survey QR">
      <button onclick="document.getElementById('modelModal').style.display='none'">Close</button>
    </div>
  </div>

  <!-- Script -->
  <script>
    const modal = document.getElementById('modelModal');
    const content = document.getElementById('modalContent');
    const viewLink = document.getElementById('viewModelsLink');

    viewLink.addEventListener('click', function (event) {
      event.preventDefault();
      modal.style.display = 'flex';
    });

    modal.addEventListener('click', function (event) {
      if (!content.contains(event.target)) {
        modal.style.display = 'none';
      }
    });
  </script>
</body>
</html>
