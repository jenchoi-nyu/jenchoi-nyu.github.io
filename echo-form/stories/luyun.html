<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echo + Form | Story</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://jenchoi-nyu.github.io/echo-form/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar"> 
    <a href="https://jenchoi-nyu.github.io/echo-form/index.html" class="logo-link">
      <img src="https://jenchoi-nyu.github.io/echo-form/Logo_white.png" alt="Echo + Form Logo" class="logo-img">
    </a>
    <a href="https://jenchoi-nyu.github.io/echo-form/experience.html" class="experience-button">Experience It</a>
  </nav>

  <!-- Story Content -->
  <div class="story-container">
    
    <div class="arrow-nav">
      <a href="kelly.html">← Previous</a>
      <a href="sanya.html">Next →</a>
    </div>

    <div class="story-header">
      <div class="avatar">
        <video controls playsinline poster="Luyun.png">
          <source src="Luyun.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>
      <div class="story-info">
        <h2 class="person-name">Luyun Zhang</h2>
        <div class="music-meta">
          <div class="track-title"><em>如愿</em> <span style="font-style: normal;">(As Wished)</span></div>
          <div class="track-author">by Faye Wong</div>
        </div>
        <p class="timeframe">[3:10–3:40]</p>
      </div>
    </div>

    <div class="story-body">
      <div class="story-media">
        <video controls playsinline poster="music/luyun_lastframe.png">
          <source src="music/Luyun_music.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
        <div class="model-link-container">
          <a href="#" id="viewModelsLink">View Parametric Models ↗</a>
        </div>
      </div>

      <div class="story-text">
        <p>I first heard it at karaoke when my cousins sang it, and I’ve loved it ever since. It ended up being my most played song last year!</p>
      </div>
    </div>
  </div>

  <!-- Popup Modal -->
  <div id="modelModal">
    <div id="modalContent">
      <img src="music/Parametric models.png" alt="Parametric Models">
      <button onclick="document.getElementById('modelModal').style.display='none'">Close</button>
    </div>
  </div>

  <!-- Script -->
  <script>
    const modal = document.getElementById('modelModal');
    const content = document.getElementById('modalContent');
    const viewLink = document.getElementById('viewModelsLink');

    viewLink.addEventListener('click', function (event) {
      event.preventDefault();
      modal.style.display = 'flex';
    });

    modal.addEventListener('click', function (event) {
      if (!content.contains(event.target)) {
        modal.style.display = 'none';
      }
    });
  </script>
</body>
</html>
