<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo + Form | Story</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://jenchoi-nyu.github.io/echo-form/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>
</head>
<body>
  <!-- Navigation Bar (same as index) -->
  <nav class="navbar">
     <a href="https://jenchoi-nyu.github.io/echo-form/index.html" class="logo-link">
        <img src="https://jenchoi-nyu.github.io/echo-form/Logo_white.png" alt="Echo + Form Logo" class="logo-img"></a>
    <a href="https://jenchoi-nyu.github.io/echo-form/experience.html" class="experience-button">Experience It</a>
  </nav>

  <!-- Content Container -->
  <div class="story-container">
    <!-- Left Panel: Text Info -->
    <div class="story-text">
      <h2>Luyun Zhang</h2>
      <h3>如愿 <em>(As Wished)</em> by Faye Wong</h3>
      <p class="timeframe">[3:10-3:40]</p>
      <p>I first heard it at karaoke when my cousins
        sang it, and I’ve loved it ever since. It ended
        up being my most played song last year!</p>
      <div class="arrow-nav">
        <a href="kelly.html">&#8592; Previous</a>
        <a href="sanya.html">Next &#8594;</a>
      </div>
    </div>

   <!-- Right Panel: Media -->
<div class="story-media">
  <!-- First Video -->
  <video width="20%" controls poster="Luyun.png">
    <source src="Luyun.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

    <!-- Parametric Model Link ABOVE the second video -->
  <div class="model-link-container">
    <a href="#" id="viewModelsLink">View Parametric Models ↗</a>
  </div>

  <!-- Second Video -->
  <video width="100%" controls poster="music/luyun_lastframe.png">
    <source src="music/Luyun_music.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>
</div>

<!-- Popup Modal -->
<div id="modelModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
  <div id="modalContent" style="position: relative; max-width: 90vw; max-height: 90vh;">
    <img src="music/Parametric models.png" alt="Parametric Models" style="width: 100%; height: auto;" />
    <button onclick="document.getElementById('modelModal').style.display='none'" style="position: absolute; top: 10px; right: 10px; background: white; border: none; padding: 6px 10px; cursor: pointer;">Close</button>
  </div>
</div>

<!-- Script -->
<script>
  const modal = document.getElementById('modelModal');
  const content = document.getElementById('modalContent');
  const viewLink = document.getElementById('viewModelsLink');

  viewLink.addEventListener('click', function (event) {
    event.preventDefault();
    modal.style.display = 'flex';
  });

  // Close when clicking outside the modal content
  modal.addEventListener('click', function (event) {
    if (!content.contains(event.target)) {
      modal.style.display = 'none';
    }
  });
</script>

</body>
</html>
